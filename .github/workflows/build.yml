# 检查（分析 + 测试）每次推送都跑；四个平台的编译手动触发，私有仓库的 macOS 分钟数按 10 倍计。
# 安装包和 GitHub Release 见 release.yml。
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: flutter analyze
      - run: dart analyze
      - run: flutter test

  build:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            os: ubuntu-latest
            output: build/app/outputs/flutter-apk/app-release.apk
          # 在最低支持的 Ubuntu 上构建，见 release.yml。
          - target: linux
            os: ubuntu-22.04
            output: build/linux/x64/release/bundle
          - target: macos
            os: macos-latest
            output: build/macos/Build/Products/Release/Ebb.app
          - target: windows
            os: windows-latest
            output: build/windows/x64/runner/Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          java: ${{ matrix.target == 'apk' }}
          linux-deps: ${{ matrix.target == 'linux' }}
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: ebb-${{ matrix.target }}
          path: ${{ matrix.output }}
          retention-days: 7
