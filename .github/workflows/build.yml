# 检查（分析 + 测试）每次推送都跑；四个平台的编译手动触发，私有仓库的 macOS 分钟数按 10 倍计。
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: dart analyze
      - run: flutter test

  build:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            os: ubuntu-latest
            output: build/app/outputs/flutter-apk/app-release.apk
          - target: linux
            os: ubuntu-latest
            output: build/linux/x64/release/bundle
          - target: macos
            os: macos-latest
            output: build/macos/Build/Products/Release/ebb.app
          - target: windows
            os: windows-latest
            output: build/windows/x64/runner/Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: ebb-${{ matrix.target }}
          path: ${{ matrix.output }}
          retention-days: 7
